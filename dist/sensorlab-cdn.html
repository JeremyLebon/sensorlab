<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sensorlab — Autonome mobiliteit & AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --bg:#e9eeeb; --surface:#f8faf9; --fg:#17201b; --muted:#5a6760; --line:#c9d3cd;
  --acc:#0b7a68; --lidar:#d26a00; --floor:#d5ddd5; --road:#8e9692; --sky:#eef2f0;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#c2402b;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1412; --surface:#161d1a; --fg:#e2eae5; --muted:#8c9a92; --line:#29332e;
  --acc:#3cc7aa; --lidar:#ffab3d; --floor:#1b2320; --road:#2a322f; --sky:#0c110f;
  --ok:#4cc27e; --warn:#e3a645; --bad:#ef6d55; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow:auto}
body{min-height:620px;min-width:320px}
/* altijd zichtbare schuifbalken (ook bij overlay-schuifbalken in Windows/macOS en in een iframe van Toledo) */
*{scrollbar-width:auto;scrollbar-color:var(--muted) var(--bg)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fg)}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.name{font:700 22px/1 var(--f-display);letter-spacing:.01em}
.sub{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.views{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));min-width:0;min-height:0}
.stage{position:relative;min-width:0;min-height:420px;overflow:hidden}
#stage{background:var(--sky)}
/* venster van een sensor (puntenwolk, radarbeeld): altijd donker */
.sview{background:#05080a;border-left:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 14px var(--f-mono);color:var(--muted)}
.hud{position:absolute;left:12px;top:12px;font:12px/1.6 var(--f-mono);background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;pointer-events:none;font-variant-numeric:tabular-nums;white-space:pre;max-width:calc(100% - 24px);overflow:hidden}
.hud .w{color:var(--warn)} .hud .r{color:var(--bad)} .hud .g{color:var(--ok)}
.tb{position:absolute;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.tb button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--fg);font:500 13px var(--f-body);padding:7px 11px;cursor:pointer}
.tb button:last-child{border-right:0}
.tb button.on{background:var(--fg);color:var(--surface)}
#views{left:12px;bottom:12px}
#modes{left:12px;bottom:52px}
#drive{right:12px;top:12px}
#drive button.on{background:var(--acc);color:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--fg);font:500 13px var(--f-body);padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button.on{background:var(--fg);color:var(--surface)}
.legend{position:absolute;right:12px;top:56px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:12px var(--f-mono);color:var(--muted);
  background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 8px;border-radius:5px;max-width:50%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .barc{width:90px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px;margin:0 4px}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:500 13px var(--f-body);background:var(--fg);color:var(--surface);padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
.toast.on{opacity:.92}
/* puntenwolkvenster: altijd donker, zoals een lidar-viewer */
.pcvhead{position:absolute;left:10px;top:10px;font:500 12px var(--f-mono);color:#9fb3bd;letter-spacing:.06em;pointer-events:none;line-height:1.6;white-space:pre}
.pcvhead b{color:#e8f1f5;font-weight:500}
.pcvtb{position:absolute;right:10px;top:10px;display:flex;border:1px solid #2a3740;border-radius:6px;overflow:hidden;background:#0d1418}
.pcvtb button{border:0;border-right:1px solid #2a3740;background:transparent;color:#cfe0e8;font:500 12.5px var(--f-body);padding:6px 10px;cursor:pointer}
.pcvtb button:last-child{border-right:0}.pcvtb button.on{background:#cfe0e8;color:#0d1418}
.pcvleg{position:absolute;right:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:12px var(--f-mono);color:#9fb3bd;background:rgba(13,20,24,.8);padding:4px 8px;border-radius:5px;max-width:calc(100% - 20px)}
.pcvleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pcvleg .barc{width:90px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px;margin:0 4px}
.sview:fullscreen{width:100vw;height:100vh}
.exph{margin:6px 0 0;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--acc)}
.meas-head h2.big{font:700 18px var(--f-display);color:var(--fg);text-transform:none;letter-spacing:0}
#sensorSel{align-self:flex-start}

.panel{border-left:1px solid var(--line);background:var(--surface);overflow-y:scroll;min-width:0;min-height:0;overscroll-behavior:contain}
.tabs{display:flex;position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:13px 4px 10px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.panel section{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.panel h2{margin:0;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.slider input{grid-column:1 / -1;width:100%;accent-color:var(--acc)}
.slider output{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.slider.dis,.grid2.dis,label.chk.dis{opacity:.45}
.grid2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:14px}
select{min-width:0;font:13px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.chk input{accent-color:var(--acc)}
table{width:100%;border-collapse:collapse;font:12px var(--f-mono);font-variant-numeric:tabular-nums}
td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
td:last-child{text-align:right}
td.lbl{font:13px var(--f-body)}
.pill{font:600 10.5px var(--f-mono);padding:1px 6px;border-radius:9px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.lo{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
b.w{color:var(--warn)} b.r{color:var(--bad)}
.exp{border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.exp.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.exp .nr{font:500 11px var(--f-mono);color:var(--acc);letter-spacing:.08em}
.exp h3{margin:0;font:600 17px/1.2 var(--f-display)}
.exp p{margin:0;font-size:14px}
.exp p.q{font-weight:500}
.exp details{font-size:14px;color:var(--muted)}
.exp summary{cursor:pointer}
button.act{align-self:flex-start;font:600 13px var(--f-body);padding:6px 12px;border-radius:5px;border:1px solid var(--fg);background:var(--fg);color:var(--surface);cursor:pointer}
.f{font:12px var(--f-mono)}
.cmp td{font:13px/1.4 var(--f-body);text-align:left;padding:6px 4px}
.cmp td:first-child{font-weight:600}
@media (max-width:1100px){.views{grid-template-columns:1fr;grid-template-rows:repeat(var(--n,2),minmax(0,1fr))}.sview{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:860px){.layout{grid-template-columns:1fr;grid-template-rows:78vh auto}.panel{border-left:0;border-top:1px solid var(--line)}.legend{display:none}.stage{min-height:260px}.hud{font-size:10.5px;padding:6px 8px}}

</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

<body>
<header class="bar">
  <div class="brand"><span class="name">Sensorlab</span><span class="sub">Autonome mobiliteit &amp; AI · labo sensoren</span></div>
  <div class="seg" id="layoutSeg" role="group" aria-label="Vensters tonen"></div>
</header>
<main class="layout">
  <div class="views" id="viewsBox">
    <section class="stage" id="stage" data-pane="world">
      <div class="loading" id="loading">3D laden…</div>
      <div class="hud" id="hud"></div>
      <div class="toast" id="toast"></div>
      <div class="tb" id="drive"><button id="driveBtn" title="Voertuig laten rijden met de ingestelde snelheid">▶ Rijden</button><button id="laneL" title="Rijstrook naar links (toets ←)">◀ strook</button><button id="laneR" title="Rijstrook naar rechts (toets →)">strook ▶</button><button id="resetBtn" title="Voertuig en verkeer terug naar start">⟲</button></div>
      <div class="tb" id="modes" role="group" aria-label="Muismodus">
        <button data-mode="orbit" class="on">Camera</button>
        <button data-mode="ped" id="pedBtn" title="Klik op de grond om de persoon te verplaatsen">Persoon plaatsen</button>
        <button data-mode="dog" id="dogBtn" title="Klik op de grond om de hond te verplaatsen">Hond plaatsen</button>
      </div>
      <div class="tb" id="views" role="group" aria-label="Camerastandpunt">
        <button data-view="free" class="on">Vrij</button>
        <button data-view="chase">Achter wagen</button>
        <button data-view="top">Boven</button>
        <button data-view="sensor">Vanuit sensor</button>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <!-- vensters van de sensoren worden door de sensor zelf toegevoegd (bv. sensors/lidar/pcview.js) -->
  </div>
  <aside class="panel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="sensor" aria-selected="true">Sensor</button>
      <button role="tab" data-tab="env" aria-selected="false">Omgeving</button>
      <button role="tab" data-tab="meas" aria-selected="false">Meting</button>
      <button role="tab" data-tab="exp" aria-selected="false">Experimenten</button>
    </nav>
    <div class="pane" id="pane-sensor"></div>
    <div class="pane" id="pane-env" hidden></div>
    <div class="pane" id="pane-meas" hidden><div id="meas"></div></div>
    <div class="pane" id="pane-exp" hidden>
      <section><p class="hint">Klik op <b>Instellen</b>: de simulator springt naar de juiste instelling. Voer de opdracht uit en open pas daarna het antwoord.</p></section>
      <section id="exps"></section>
    </div>
  </aside>
</main>
<script type="module">
/* sensorlab 0.1.0 · build 2026-11-25 */

// src/core/util.js
var D2R = Math.PI / 180;
var nl = (v, d) => Number(v).toFixed(d).replace(".", ",");
var $ = (id) => document.getElementById(id);
function mulberry32(a) {
  return function() {
    a |= 0;
    a = a + 1831565813 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var fmod = (a, b) => (a % b + b) % b;
function gauss(rng) {
  return Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(2 * Math.PI * rng());
}
var toastT = 0;
function toast(t) {
  const el = $("toast");
  el.textContent = t;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("on"), 2400);
}

// src/core/state.js
var S = {
  world: "street",
  rain: 0,
  fog: 0,
  dust: false,
  dustD: 0.6,
  wet: false,
  interf: false,
  speed: 8,
  objects: "full",
  ped: { x: 12, y: 1.2 },
  dog: { x: 7, y: -1.8 },
  vx: 0,
  vy: 0
};
var EGO = { yaw: 0, vyRate: 0, target: 0 };
var BASE = JSON.parse(JSON.stringify(S));
var F = { dirty: true, worldDirty: true, pendingCam: null, driving: false };
var WORLDSTART = { street: { ped: { x: 12, y: 1.2 }, dog: { x: 7, y: -1.8 }, speed: 8 }, farm: { ped: { x: 18, y: -2 }, dog: { x: 9, y: 1.6 }, speed: 6 }, highway: { ped: { x: 334, y: -8.2 }, dog: { x: 0, y: 0 }, speed: 30 } };

// src/worlds/street.js
var street_default = {
  label: "Straat",
  build({ O, box, cyl, wall, car, person }) {
    let o;
    const W2 = {
      ground: "street",
      lanes: [0, 3.5],
      x0: -60,
      x1: 110,
      roads: [[-5.75, 7.75]],
      start: 0,
      end: 46,
      dust: { dx: 10, dy: -0.5, r: 4.5 },
      hud: [["Voetganger", "voetganger"], ["Hond (0,5 m)", "hond"]]
    };
    o = O("Voetganger", 0.35, "#e2557a", { key: true });
    person(o, S.ped.x, S.ped.y);
    o = O("Hond (0,5 m)", 0.3, "#c98a4b", { key: true });
    box(o, S.dog.x, S.dog.y, 0.75, 0.28, 0, 0.5, 0.4, "dog");
    o.hx = S.dog.x;
    o.hy = S.dog.y;
    o = O("Witte auto", 0.7, "#f1f4f6", { key: true });
    car(o, 16, -3.6, 0);
    o = O("Zwarte auto (5 %)", 0.05, "#16191c", { key: true });
    car(o, 25, 4.6, Math.PI);
    o = O("Vrachtwagen-laadbak (vanaf 1,0 m)", 0.45, "#3d7cc9", { key: true });
    box(o, 38, -3.4, 6.5, 2.4, 1, 3.6);
    o = O("Vrachtwagen-cabine en wielen", 0.45, "#2f5e98");
    box(o, 42.4, -3.4, 2.2, 2.4, 0.4, 3.2);
    for (const x of [37.5, 40.8]) for (const y of [-2.4, -4.4]) box(o, x, y, 1, 0.3, 0, 1, 0, "wheel");
    o = O("Slagboom (0,9\u20131,0 m)", 0.6, "#e04848", { key: true });
    box(o, 52, -0.6, 0.1, 7.6, 0.9, 1);
    o = O("Slagboompaal", 0.5, "#cfd5da");
    box(o, 52, -4.8, 0.3, 0.3, 0, 1.1);
    o = O("Stoeprand (15 cm)", 0.25, "#9aa3ab", { key: true });
    wall(o, -60, -5.9, 110, -5.9, 0, 0.15, 0.25);
    wall(o, -60, 7.9, 110, 7.9, 0, 0.15, 0.25);
    o = O("Palen (\xD8 12 cm)", 0.5, "#7fb03c", { key: true });
    for (let x = -36; x <= 100; x += 8) cyl(o, x + 2, -7.2, 0.06, 0, 3.5);
    o = O("Verkeersbord (retroreflecterend)", 3, "#2a8fd6", { key: true });
    box(o, 20, -7.6, 0.05, 0.8, 1.7, 2.4);
    o = O("Paal verkeersbord", 0.5, "#9aa3ab");
    cyl(o, 20, -7.6, 0.04, 0, 1.7);
    o = O("Glaswand bushokje", 0.08, "#8fc4ff", { glass: true, key: true });
    wall(o, 22, 9.4, 29, 9.4, 0, 2.5, 0.04);
    o = O("Bushokje (dak en zijkant)", 0.4, "#7b8794");
    box(o, 25.5, 10.4, 7.2, 2.2, 2.5, 2.65);
    wall(o, 22, 9.4, 22, 11.4, 0, 2.5, 0.08);
    o = O("Persoon achter glas", 0.35, "#e2557a", { key: true });
    person(o, 25.5, 10.6);
    o = O("Haag", 0.15, "#4f9a52", { key: true });
    box(o, -10, -10, 8, 1.4, 0, 1.3);
    o = O("Gebouw", 0.4, "#a7b0b8");
    box(o, 46, 19, 18, 8, 0, 9);
    box(o, -26, 16, 14, 8, 0, 7);
    box(o, 8, 17, 12, 7, 0, 6);
    o = O("Muur", 0.5, "#a7b0b8");
    wall(o, -60, -15, 110, -15, 0, 2.5, 0.3);
    return W2;
  },
  isMark(x, y) {
    if (Math.abs(y - 1) < 0.07 && fmod(x, 6) < 3) return true;
    if (Math.abs(y + 5.45) < 0.07 || Math.abs(y - 7.45) < 0.07) return true;
    if (x > 30 && x < 34 && y > -5.6 && y < 7.6 && fmod(y + 5.6, 1) < 0.5) return true;
    return false;
  },
  marks(dashes, solids, W2) {
    for (let x = W2.x0; x < W2.x1; x += 6) dashes.push([x + 1.5, 1, 3, 0.14]);
    solids.push([-5.45, 0.14], [7.45, 0.14]);
    for (let y = -5.6; y < 7.6; y += 1) dashes.push([32, y + 0.25, 4, 0.5]);
  }
};

// src/worlds/highway.js
var highway_default = {
  label: "Snelweg",
  build({ O, box, cyl, wall, car, truck, person }) {
    let o;
    const W2 = {
      ground: "highway",
      lanes: [-3.5, 0, 3.5],
      x0: -300,
      x1: 1100,
      roads: [[-8.2, 5.6], [6.3, 17.6]],
      start: 0,
      end: 860,
      dust: { dx: 12, dy: 0, r: 5 },
      hud: [["Auto voor ons", "auto voor ons"], ["Verloren band (0,25 m)", "verloren band"]]
    };
    o = O("Auto voor ons", 0.7, "#f1f4f6", { key: true, v: 29 });
    car(o, 40, 0, 0);
    o = O("Zwarte auto (5 %)", 0.05, "#16191c", { key: true, v: 33 });
    car(o, 14, 3.5, 0);
    o = O("Auto achter ons", 0.5, "#b3262b", { key: true, v: 30.5 });
    car(o, -26, 0, 0);
    o = O("Vrachtwagen met oplegger", 0.45, "#d9dde0", { key: true, v: 24 });
    truck(o, 70, -3.5);
    o = O("Motorrijder", 0.3, "#2d2f33", { key: true, v: 36 });
    box(o, -45, 3.5, 2.1, 0.75, 0, 1.5, 0, false);
    o.models.push({ k: "moto", cx: -45, cy: 3.5 });
    o.hx = -45;
    o.hy = 3.5;
    for (const [x, y, c, v] of [[120, 11.95, "#8c97a3", -31], [260, 8.45, "#2b5aa8", -34], [360, 15.45, "#e6e9ec", -28]]) {
      o = O("Tegenliggers", 0.6, c, { key: true, v });
      o.tid = x;
      car(o, x, y, Math.PI, c);
    }
    o = O("Verloren band (0,25 m)", 0.08, "#1d1f22", { key: true });
    cyl(o, 130, 0.2, 0.36, 0, 0.25, "tire");
    o.hx = 130;
    o.hy = 0.2;
    o = O("Pechauto op pechstrook", 0.6, "#c7a12b", { key: true });
    car(o, 330, -6.6, 0.05);
    o = O("Persoon op pechstrook", 0.35, "#ff7a1a", { key: true });
    person(o, S.ped.x, S.ped.y);

import * as THREE3 from "three";
var RAIN_N = 2500;
var rainGeo = new THREE3.BufferGeometry();
var rainPos = new Float32Array(RAIN_N * 6);
rainGeo.setAttribute("position", new THREE3.BufferAttribute(rainPos, 3));
var rain = new THREE3.LineSegments(rainGeo, new THREE3.LineBasicMaterial({ color: 7311280, transparent: true, opacity: 0.45 }));
rain.frustumCulled = false;
scene.add(rain);
for (let i = 0; i < RAIN_N; i++) {
  rainPos[i * 6] = Math.random() * 60 - 20;
  rainPos[i * 6 + 1] = Math.random() * 15;
  rainPos[i * 6 + 2] = Math.random() * 40 - 20;
}
function updateRain(dt) {
  rain.visible = S.rain > 0;
  if (!rain.visible) return;
  const cnt = Math.floor(RAIN_N * S.rain);
  for (let i = 0; i < RAIN_N; i++) {
    let y = rainPos[i * 6 + 1] - dt * 9;
    if (y < 0) y += 15;
    rainPos[i * 6 + 1] = y;
    let X = rainPos[i * 6];
    if (X < S.vx - 20) X += 60;
    if (X > S.vx + 40) X -= 60;
    rainPos[i * 6] = X;
    rainPos[i * 6 + 3] = X;
    rainPos[i * 6 + 4] = y + 0.35;
    rainPos[i * 6 + 5] = rainPos[i * 6 + 2];
  }
  rainGeo.setDrawRange(0, cnt * 2);
  rainGeo.attributes.position.needsUpdate = true;
}
var DUST_N = 1500;
var dustGeo = new THREE3.BufferGeometry();
var dustBase = new Float32Array(DUST_N * 3);
var dustPos = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) {
  const r = Math.cbrt(Math.random()), th = Math.random() * 2 * Math.PI, ph = Math.acos(2 * Math.random() - 1);
  dustBase[i * 3] = r * Math.sin(ph) * Math.cos(th);
  dustBase[i * 3 + 1] = Math.abs(r * Math.cos(ph)) * 0.65;
  dustBase[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
}
dustGeo.setAttribute("position", new THREE3.BufferAttribute(dustPos, 3));
var dustMat = new THREE3.PointsMaterial({ color: 12096090, size: 0.35, transparent: true, opacity: 0.25, depthWrite: false });
var dust = new THREE3.Points(dustGeo, dustMat);
dust.frustumCulled = false;
scene.add(dust);
var tt = 0;
function updateDust(dt) {
  dust.visible = S.dust;
  if (!S.dust) return;
  tt += dt;
  const d = W.dust, cx = S.vx + d.dx;
  for (let i = 0; i < DUST_N; i++) {
    dustPos[i * 3] = cx + dustBase[i * 3] * d.r + Math.sin(tt * 0.7 + i) * 0.15;
    dustPos[i * 3 + 1] = dustBase[i * 3 + 1] * d.r;
    dustPos[i * 3 + 2] = -(d.dy + dustBase[i * 3 + 2] * d.r);
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustMat.opacity = 0.12 + 0.3 * S.dustD;
}
function updateFog() {
  scene.fog = S.fog > 0 ? new THREE3.FogExp2(css("--sky"), S.fog * 0.045) : null;
}

  for (const s of SENSORS) s.animate(dt);
  updateRain(dt);
  updateDust(dt);
  if (VIS.has("world")) renderer.render(scene, camera);
  for (const s of SENSORS) s.render(VIS);
  requestAnimationFrame(frame);
}
function start() {
  new ResizeObserver(resize).observe($("viewsBox"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    themeColors();
    updateFog();
  });
  buildPanels();
  buildLayoutButtons();
  buildControls();
  buildExps();
  syncControls();
  buildWorld();
  buildWorldMeshes();
  F.worldDirty = false;
  resize();
  setView("free");
  for (const s of SENSORS) if (s.init) s.init();
  setLayout(innerWidth < 860 ? ["world"] : ["world", ...SENSORS.map((s) => s.views[0].id)]);
  requestAnimationFrame(frame);
  window.__sim = { EGO, S, SENSORS, applyState, EXPS: EXPS2, stat: SENSORS[0].stats, setLayout, W: () => W, bench: SENSORS[0].bench };
}

// src/main.js
start();
</script>
