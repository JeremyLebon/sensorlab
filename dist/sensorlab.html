<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sensorlab — Autonome mobiliteit & AI</title>
<!-- sensorlab 0.1.0 · build 2026-11-25 · offline-versie: geen externe bestanden -->
<style>
[hidden]{display:none!important}
:root{
  --bg:#e9eeeb; --surface:#f8faf9; --fg:#17201b; --muted:#5a6760; --line:#c9d3cd;
  --acc:#0b7a68; --lidar:#d26a00; --floor:#d5ddd5; --road:#8e9692; --sky:#eef2f0;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#c2402b;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1412; --surface:#161d1a; --fg:#e2eae5; --muted:#8c9a92; --line:#29332e;
  --acc:#3cc7aa; --lidar:#ffab3d; --floor:#1b2320; --road:#2a322f; --sky:#0c110f;
  --ok:#4cc27e; --warn:#e3a645; --bad:#ef6d55; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow:auto}
body{min-height:620px;min-width:320px}
/* altijd zichtbare schuifbalken (ook bij overlay-schuifbalken in Windows/macOS en in een iframe van Toledo) */
*{scrollbar-width:auto;scrollbar-color:var(--muted) var(--bg)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fg)}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.name{font:700 22px/1 var(--f-display);letter-spacing:.01em}
.sub{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.views{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));min-width:0;min-height:0}
.stage{position:relative;min-width:0;min-height:420px;overflow:hidden}
#stage{background:var(--sky)}
/* venster van een sensor (puntenwolk, radarbeeld): altijd donker */
.sview{background:#05080a;border-left:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 14px var(--f-mono);color:var(--muted)}
.hud{position:absolute;left:12px;top:12px;font:12px/1.6 var(--f-mono);background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;pointer-events:none;font-variant-numeric:tabular-nums;white-space:pre;max-width:calc(100% - 24px);overflow:hidden}
.hud .w{color:var(--warn)} .hud .r{color:var(--bad)} .hud .g{color:var(--ok)}
.tb{position:absolute;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.tb button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--fg);font:500 13px var(--f-body);padding:7px 11px;cursor:pointer}
.tb button:last-child{border-right:0}
.tb button.on{background:var(--fg);color:var(--surface)}
#views{left:12px;bottom:12px}
#modes{left:12px;bottom:52px}
#drive{left:12px;bottom:92px}
#drive button.on{background:var(--acc);color:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--fg);font:500 13px var(--f-body);padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button.on{background:var(--fg);color:var(--surface)}
.legend{position:absolute;right:12px;bottom:136px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:12px var(--f-mono);color:var(--muted);
  background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 8px;border-radius:5px;max-width:50%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .barc{width:90px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px;margin:0 4px}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:500 13px var(--f-body);background:var(--fg);color:var(--surface);padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
.toast.on{opacity:.92}
/* puntenwolkvenster: altijd donker, zoals een lidar-viewer */
.pcvhead{position:absolute;left:10px;top:10px;font:500 12px var(--f-mono);color:#9fb3bd;letter-spacing:.06em;pointer-events:none;line-height:1.6;white-space:pre}
.pcvhead b{color:#e8f1f5;font-weight:500}
.pcvtb{position:absolute;right:10px;top:10px;display:flex;border:1px solid #2a3740;border-radius:6px;overflow:hidden;background:#0d1418}
.pcvtb button{border:0;border-right:1px solid #2a3740;background:transparent;color:#cfe0e8;font:500 12.5px var(--f-body);padding:6px 10px;cursor:pointer}
.pcvtb button:last-child{border-right:0}.pcvtb button.on{background:#cfe0e8;color:#0d1418}
.pcvleg{position:absolute;right:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:12px var(--f-mono);color:#9fb3bd;background:rgba(13,20,24,.8);padding:4px 8px;border-radius:5px;max-width:calc(100% - 20px)}
.pcvleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pcvleg .barc{width:90px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px;margin:0 4px}
.sview:fullscreen{width:100vw;height:100vh}
.exph{margin:6px 0 0;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--acc)}
.meas-head h2.big{font:700 18px var(--f-display);color:var(--fg);text-transform:none;letter-spacing:0}
#sensorSel{align-self:flex-start}

.panel{border-left:1px solid var(--line);background:var(--surface);overflow-y:scroll;min-width:0;min-height:0;overscroll-behavior:contain}
.tabs{display:flex;position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:13px 4px 10px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.panel section{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.panel h2{margin:0;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.slider input{grid-column:1 / -1;width:100%;accent-color:var(--acc)}
.slider output{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.slider.dis,.grid2.dis,label.chk.dis{opacity:.45}
.grid2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:14px}
select{min-width:0;font:13px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.chk input{accent-color:var(--acc)}
table{width:100%;border-collapse:collapse;font:12px var(--f-mono);font-variant-numeric:tabular-nums}
td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
td:last-child{text-align:right}
td.lbl{font:13px var(--f-body)}
.pill{font:600 10.5px var(--f-mono);padding:1px 6px;border-radius:9px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.lo{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.no{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
b.w{color:var(--warn)} b.r{color:var(--bad)}
.exp{border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.exp.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.exp .nr{font:500 11px var(--f-mono);color:var(--acc);letter-spacing:.08em}
.exp h3{margin:0;font:600 17px/1.2 var(--f-display)}
.exp p{margin:0;font-size:14px}
.exp p.q{font-weight:500}
.exp details{font-size:14px;color:var(--muted)}
.exp summary{cursor:pointer}
button.act{align-self:flex-start;font:600 13px var(--f-body);padding:6px 12px;border-radius:5px;border:1px solid var(--fg);background:var(--fg);color:var(--surface);cursor:pointer}
.f{font:12px var(--f-mono)}
.cmp td{font:13px/1.4 var(--f-body);text-align:left;padding:6px 4px}
.cmp td:first-child{font-weight:600}
@media (max-width:1100px){.views{grid-template-columns:1fr;grid-template-rows:repeat(var(--n,2),minmax(0,1fr))}.sview{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:860px){.layout{grid-template-columns:1fr;grid-template-rows:78vh auto}.panel{border-left:0;border-top:1px solid var(--line)}.legend{display:none}.stage{min-height:260px}.hud{font-size:10.5px;padding:6px 8px}}

</style>

</head>
<body>
<header class="bar">
  <div class="brand"><span class="name">Sensorlab</span><span class="sub">Autonome mobiliteit &amp; AI · labo sensoren</span></div>
  <div class="seg" id="layoutSeg" role="group" aria-label="Vensters tonen"></div>
</header>
<main class="layout">
  <div class="views" id="viewsBox">
    <section class="stage" id="stage" data-pane="world">
      <div class="loading" id="loading">3D laden…</div>
      <div class="hud" id="hud"></div>
      <div class="toast" id="toast"></div>
      <div class="tb" id="drive"><button id="driveBtn" title="Voertuig laten rijden met de ingestelde snelheid">▶ Rijden</button><button id="laneL" title="Rijstrook naar links (toets ←)">◀ strook</button><button id="laneR" title="Rijstrook naar rechts (toets →)">strook ▶</button><button id="resetBtn" title="Voertuig en verkeer terug naar start">⟲</button></div>
      <div class="tb" id="modes" role="group" aria-label="Muismodus">
        <button data-mode="orbit" class="on">Camera</button>
        <button data-mode="ped" id="pedBtn" title="Klik op de grond om de persoon te verplaatsen">Persoon plaatsen</button>
        <button data-mode="dog" id="dogBtn" title="Klik op de grond om de hond te verplaatsen">Hond plaatsen</button>
      </div>
      <div class="tb" id="views" role="group" aria-label="Camerastandpunt">
        <button data-view="free" class="on">Vrij</button>
        <button data-view="chase">Achter wagen</button>
        <button data-view="top">Boven</button>
        <button data-view="sensor">Vanuit sensor</button>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <!-- vensters van de sensoren worden door de sensor zelf toegevoegd (bv. sensors/lidar/pcview.js) -->
  </div>
  <aside class="panel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="sensor" aria-selected="true">Sensor</button>
      <button role="tab" data-tab="env" aria-selected="false">Omgeving</button>
      <button role="tab" data-tab="meas" aria-selected="false">Meting</button>
      <button role="tab" data-tab="exp" aria-selected="false">Experimenten</button>
    </nav>
    <div class="pane" id="pane-sensor"></div>
    <div class="pane" id="pane-env" hidden></div>
    <div class="pane" id="pane-meas" hidden><div id="meas"></div></div>
    <div class="pane" id="pane-exp" hidden>
      <section><p class="hint">Klik op <b>Instellen</b>: de simulator springt naar de juiste instelling. Voer de opdracht uit en open pas daarna het antwoord.</p></section>
      <section id="exps"></section>
    </div>
  </aside>
</main>

jecten krijgen 0 punten? Zet daarna de <b>montagehoogte</b> op 1,00 m. Wat wordt nu w\xE9l gezien, en wat verdwijnt?",a:"Op 0,25 m: slagboom, vrachtwagen-laadbak, verkeersbord en stoeprand (15 cm) worden niet gezien, en van de witte auto enkel de wielen. De vrachtwagen lijkt pas te beginnen bij de wielen, terwijl de laadbak veel eerder komt: botsing. Op 1,00 m zie je laadbak en slagboom, maar hond (0,5 m) en stoeprand verdwijnen."},{t:"Meer lagen, meer zicht op afstand",set:{ped:{x:22,y:1.2},objects:"ghost",lidar:{preset:"vlp16",color:"layer"}},u:'Tussen twee lagen zit een vaste hoek. De verticale opening groeit met de afstand: <span class="f">\u0394z \u2248 d\xB7tan(\u0394hoek)</span>. Bij 16 lagen over 30\xB0 is dat 2\xB0 per laag.',q:"Hoeveel punten krijgt de voetganger (zie HUD)? Verplaats hem met <b>Persoon plaatsen</b> naar ~40 m. Kies daarna <b>64 lagen</b> en vergelijk.",a:"Met 16 lagen zitten de lagen op 20 m ongeveer 0,7 m uit elkaar: slechts 2\u20133 lagen raken de voetganger, op 40 m soms maar 1. Met 64 lagen worden het er 4\xD7 zoveel. De slagboom (10 cm hoog) valt zelfs tussen de lagen door."},{t:"Horizontale resolutie en dunne palen",set:{view:"top",lidar:{preset:"vlp16",color:"source"}},u:'Horizontaal staan de stralen <span class="f">d\xB7\u0394\u03B8</span> uit elkaar. Een paal van 12 cm valt tussen twee stralen als die opening groter is dan de paal.',q:"Bekijk de rij palen bij 0,2\xB0. Zet de <b>horizontale resolutie</b> op 1,6\xB0 en daarna 3,2\xB0. Vanaf welke afstand mis je palen?",a:"Bij 1,6\xB0 is de opening op 10 m al 28 cm: een paal van 12 cm wordt vanaf ~4\u20135 m niet meer elke scan geraakt. Bij 3,2\xB0 verdwijnen de meeste palen."},{t:"Zwart en wit: reflectie bepaalt het bereik",set:{lidar:{preset:"vlp16",rmax:30,color:"intensity"}},u:'Het teruggekaatste signaal is ongeveer <span class="f">\u03C1 / R\xB2</span>. Een datasheetbereik geldt bij 10 % reflectie. Een zwarte auto (5 %) kaatst veel minder terug dan een witte (70 %).',q:'Het bereik staat op 30 m @10 %. Vergelijk de punten op de <b>witte</b> en de <b>zwarte auto</b>. Verhoog het bereik tot de zwarte auto "gezien" is.',a:"Effectief bereik voor 5 % \u2248 \u221A(0,05/0,1) \xD7 30 = 21 m: de zwarte auto op ~25 m valt weg, de witte niet. Vanaf ongeveer 40 m bereik verschijnt de zwarte auto. Het retroreflecterende verkeersbord geeft juist een extreem sterk signaal."},{t:"Glas: de lidar kijkt erdoor",set:{objects:"ghost",lidar:{preset:"vlp16",color:"source"}},u:"Laserlicht gaat grotendeels door glas. Slechts een klein deel van de stralen kaatst terug op de glaswand.",q:"Bekijk het bushokje. Hoeveel punten krijgen de <b>glaswand</b> en de <b>persoon achter glas</b>? Wat betekent dit voor een voertuig dat een glazen gevel of etalage nadert?",a:"De glaswand krijgt weinig, onregelmatige punten; de persoon erachter wordt wel gezien. Glas bestaat nauwelijks in de puntenwolk. Radar en camera vullen dat aan (sensorfusie)."},{t:"Kantelfout (pitch): fantoomobstakels",set:{view:"top",lidar:{preset:"vlp16",color:"class",err:{pitch:1}}},u:"De sensor staat in werkelijkheid 1\xB0 gekanteld (kijk naar de sensor op het dak), maar de software denkt dat hij recht staat. Punten boven 0,2 m worden als obstakel geclassificeerd.",q:'Waar verschijnen oranje "obstakels" op de grond? Zet de kanteling op \u22121\xB0. Wat verandert er?',a:'Bij +1\xB0 kijkt de sensor achteraan naar beneden: grond achter de wagen wordt te hoog berekend en wordt "obstakel" \u2192 fantoomremming bij achteruitrijden. Bij \u22121\xB0 wordt de grond v\xF3\xF3r de wagen een obstakel \u2192 noodremming zonder reden. 1\xB0 op 20 m = 35 cm hoogtefout.'},{t:"Gierhoekfout (yaw): fout groeit met afstand",set:{objects:"ghost",view:"top",lidar:{preset:"vlp16",err:{yaw:3}}},u:'De sensor is 3\xB0 gedraaid gemonteerd. Een hoekfout geeft een zijdelingse fout van <span class="f">d\xB7tan(3\xB0) \u2248 5 cm per meter</span>.',q:"Vergelijk de puntenwolk met de doorschijnende objecten. Hoe groot is de verschuiving bij de witte auto (~16 m) en bij de vrachtwagen (~38 m)? Wat betekent dat op de snelweg op 100 m?",a:"Ongeveer 0,8 m bij de auto en 2 m bij de vrachtwagen. Op 100 m is dat 5 m: een auto in de rijstrook naast je lijkt in jouw rijstrook te staan. Daarom kalibreer je op verre objecten of met een kalibratiedoel op gekende positie."},{t:"Verloren band op de snelweg",set:{world:"highway",view:"chase",lidar:{preset:"vlp16",color:"source"}},u:'Bij 108 km/h (30 m/s) is de stopafstand ongeveer <span class="f">30\xB71 + 30\xB2/(2\xB77) \u2248 94 m</span>. Een band van 25 cm hoog ligt 128 m voor de wagen in jouw rijstrook (zie HUD).',q:"Krijgt de band punten? Klik op <b>Rijden</b> en kijk in het puntenwolkvenster op welke afstand de band verschijnt. Probeer daarna <b>Roterend, 128 lagen</b> en <b>Solid-state in grille</b>. Welke sensor ziet hem op tijd?",a:"Met 16 lagen liggen de lagen op 100 m 3,5 m uit elkaar en raakt geen enkele laag de band: hij verschijnt pas rond 30 m, ver binnen de stopafstand. De 128-lagensensor (naar beneden gericht, lang bereik) geeft de eerste punten rond 100 m, de solid-state rond 70 m. Maar 2\u20133 punten zijn nog geen herkenbaar object: dat vraagt opvolging over meerdere scans. Lage, donkere objecten op afstand zijn de moeilijkste opgave voor snelwegpiloten."},{t:"Rijstrookmarkering met intensiteit",set:{world:"highway",view:"top",objects:"ghost",lidar:{preset:"os64",color:"intensity"}},u:"Wegmarkering bevat glasparels en kaatst veel meer licht terug dan asfalt. In de intensiteit van de lidar zie je de markering dus, ook zonder camera.",q:"Herken je de rijstroken in het puntenwolkvenster? Tot welke afstand? Zet daarna <b>Nat wegdek</b> aan. Wat gebeurt er met asfalt en markering?",a:"De markering licht op tot ~30\u201340 m, verder komen er te weinig grondpunten (scherende hoek). Op een nat wegdek verdwijnt het asfalt bijna volledig en wordt de markering zwakker: lijnherkenning wordt onbetrouwbaar."},{t:"Brug en portiek: obstakel of niet?",set:{world:"highway",view:"chase",drive:!0,lidar:{preset:"os64",color:"class"}},u:"Een eenvoudig algoritme noemt alles boven 0,2 m een obstakel. Op de snelweg passeer je een portiek met borden (5,3 m) en een brug (5,4 m).",q:"Wat zie je in het puntenwolkvenster als je de portiek en de brug nadert? Hoe kun je met de hoogte van de punten vermijden dat de wagen remt? Welk gevaar heeft zo'n filter?",a:'Portiek, borden en brug verschijnen oranje als "obstakel" midden boven de weg. Filter op een hoogtevenster (bv. 0,2\u20132,5 m boven de weg). Gevaar: een te laag venster mist een hoge laadbak of een te lage brug; bij een kantelfout van 1\xB0 schuift het venster op 100 m al 1,7 m.'},{t:"Rijden met een roterende lidar",set:{world:"highway",speed:33,drive:!0,view:"top",objects:"ghost",lidar:{preset:"vlp16",freq:10,color:"height",deskew:!1}},u:'Een roterende lidar doet ~0,1 s over \xE9\xE9n omwenteling. Tijdens die tijd rijdt de wagen <span class="f">v / f</span> verder: bij 120 km/h is dat 3,3 m. De scan begint en eindigt achteraan.',q:"De bewegingscompensatie staat uit. Kijk naar de vangrail en de middenberm in het puntenwolkvenster (Boven). Zie je de knik achteraan? Zet de frequentie op 20 Hz en daarna <b>bewegingscompensatie</b> weer aan.",a:"Achteraan sluit de scan niet aan: de vangrail maakt een sprong van ~3 m. 20 Hz halveert de fout. Deskew met odometrie of IMU corrigeert de eigen beweging. Ander verkeer beweegt ook tijdens de scan; dat lost deskew niet op."},{t:"Regen en nat wegdek",set:{world:"highway",rain:.8,wet:!0,lidar:{preset:"vlp16",color:"source",live:!0}},u:"Regendruppels geven losse spikkels dicht bij de sensor en verzwakken het signaal. Een nat wegdek is spiegelend: het licht kaatst weg in plaats van terug.",q:"Let op de meetwaarden <b>bereik wit/zwart</b> en <b>stopafstand</b>. Zet daarna regen op droog en het wegdek droog. Wat valt op?",a:"Op het natte wegdek verdwijnen de grondpunten op afstand bijna volledig, waardoor rijbaan en markering moeilijk te detecteren zijn. De regen geeft ruispunten dichtbij en verkort het bereik, terwijl de stopafstand op nat wegdek net langer wordt."},{t:"Stof: eerste of laatste echo?",set:{world:"farm",dust:!0,dustD:.7,ped:{x:12,y:.5},lidar:{preset:"vlp16",color:"source"}},u:"Een stofwolk (oogst, grondbewerking, onverharde weg) kaatst een deel van het licht terug. Veel lidars kunnen meerdere echo's per puls meten.",q:"Met <b>eerste echo</b>: wat zie je in de stofwolk, en wordt de persoon in de wolk nog gezien? Schakel naar <b>laatste echo</b> en vergelijk. Welk nadeel heeft laatste echo?",a:"Met eerste echo vormt het stof een muur van punten: een noodstop zou triggeren en de persoon wordt grotendeels gemist. Met laatste echo kijk je door het stof. Nadeel: dunne of halftransparante objecten (draad, takken, glas) v\xF3\xF3r iets anders gaan verloren."},{t:"Persoon in het gewas en een draadafsluiting",set:{world:"farm",objects:"ghost",lidar:{preset:"vlp16",color:"height"}},u:"Een gewas van 0,8 m is voor de lidar een muur: alles erachter en eronder is onzichtbaar. Een draad is maar enkele millimeter dik.",q:"Hoeveel punten krijgt de <b>persoon tussen het gewas</b>, en op welke hoogte liggen die punten? Wordt de <b>draadafsluiting</b> gezien?",a:"Enkel het bovenlichaam boven het gewas levert punten op. De draad levert enkel punten waar een laag toevallig op draadhoogte zit: een paar losse boogjes dichtbij, geen doorlopende lijn, en op afstand niets meer."},{t:"Statisch vs roterend, en de montageplaats",set:{lidar:{preset:"solid",color:"height"}},u:"Een solid-state lidar zit in de grille: geen draaiende delen, maar een beperkt gezichtsveld (120\xB0). Een roterende op het dak ziet rondom, maar het dak schermt de onderste lagen af.",q:"Wat ziet de solid-state lidar niet? Kies daarna <b>Roterend, 64 lagen</b> en vergelijk <b>Dak, midden</b> met <b>Dak, boven voorruit</b>: let op % geblokkeerd en op de hond vlak voor de wagen.",a:"Alles naast en achter de wagen valt buiten beeld; voor 360\xB0 zijn 3\ . Een auto heeft ongeveer 10 m\xB2, een voetganger 0,5 m\xB2, een vrachtwagen 100 m\xB2. Metaal kaatst sterk terug; de kleur speelt voor radar geen rol.',q:"Lees in <b>Meting</b> \u2192 Radar het bereik voor een voetganger en voor een auto. Hoeveel keer kleiner is de RCS, en hoeveel keer korter het bereik? Verplaats de voetganger met <b>Persoon plaatsen</b> naar ongeveer 35 m en daarna 45 m voor de wagen: ziet de radar hem nog? Wordt de zwarte auto slechter gezien dan de witte?",a:"Voetganger \xB138 m, auto 80 m. Een 20 keer kleinere RCS geeft maar 20<sup>\xBC</sup> \u2248 2,1 keer korter bereik. Op 35 m wordt de voetganger nog net gezien (zwak signaal), op 45 m niet meer. De zwarte auto wordt even goed gezien als de witte: voor radar telt het metaal, niet de kleur (voor lidar wel, zie experiment 4)."},{t:"Hoekresolutie: twee worden \xE9\xE9n",set:{ped:{x:12,y:1.2},dog:{x:12,y:2},layout:["world","lidar","radar"],lidar:{preset:"vlp16"},radar:{preset:"mrr",color:"source"}},u:"Een radar onderscheidt twee doelen enkel als ze verschillen in afstand, in snelheid (Doppler) \xF3f in hoek. Een radar voor middellange afstand heeft ongeveer 5\xB0 hoekresolutie: op 12 m is dat ongeveer 1 m breed. De hond staat 0,8 m naast de voetganger, even ver en even stil.",q:"Hoeveel radardetecties zie je bij de voetganger en de hond (<b>Meting</b> \u2192 Radar, en in het radarbeeld)? Waar ligt de detectie? Kies daarna in tabblad <b>Sensor</b> \u2192 <b>Radar</b> het voorbeeld <b>4D-beeldradar</b> (1\xB0). Wat ziet de lidar?",a:'Met 5\xB0 geeft de radar \xE9\xE9n detectie, tussen voetganger en hond in; de hond staat op "niet gezien". Beide zijn even ver, even stil en liggen binnen \xE9\xE9n hoekresolutie. De 4D-beeldradar (1\xB0) ziet ze apart. De lidar (0,2\xB0) ziet beide, met hun vorm. In het verkeer: een kind naast een geparkeerde auto smelt voor een eenvoudige radar samen met de auto.'},{t:"Doppler: snelheid rechtstreeks gemeten",set:{world:"highway",drive:!0,layout:["world","radar"],lidar:{preset:"vlp16"},radar:{preset:"mrr",color:"vr",multipath:!1}},u:"Een radar meet de radiale snelheid rechtstreeks via het Dopplereffect: hoe snel een doel naar de radar toe komt (negatief) of ervan weg gaat (positief). De eigen wagen rijdt 30 m/s (108 km/h). Rood = naderend, blauw = wegrijdend, grijs = even snel als wij. Het lijntje bij elke detectie is de snelheid \xD7 0,5 s.",q:"Lees in <b>Meting</b> \u2192 Radar de radiale snelheid van de auto voor ons, de zwarte auto, de vrachtwagen en een tegenligger. Hoe snel rijden die zelf? Waarom heeft de vangrail een radiale snelheid, terwijl hij stilstaat?",a:"Auto voor ons \u2248 \u22121 m/s: hij rijdt 29 m/s, wij halen hem langzaam in. Zwarte auto \u2248 +3 m/s: hij rijdt 33 m/s. Vrachtwagen \u2248 \u22126 m/s: 24 m/s. Tegenligger \u221250 \xE0 \u221262 m/s: hij rijdt zelf \xB131 m/s, in tegengestelde zin (30 + 31 = 61); hoe schuiner we hem zien, hoe kleiner de radiale snelheid (\xD7 cos kijkhoek). De vangrail staat stil, maar wij rijden: radiale snelheid = \u221230 m/s \xD7 cos(kijkhoek). Een lidar moet de snelheid afleiden uit twee opeenvolgende scans."},{t:"Stilstaande doelen en ACC",set:{world:"highway",drive:!0,layout:["world","radar"],lidar:{preset:"vlp16"},radar:{preset:"lrr",color:"stat"}},u:"Op de snelweg staat veel stil: vangrail, borden, bruggen, een pechauto. Veel ACC-systemen (adaptieve cruisecontrol) negeren stilstaande doelen: anders zou een brug of een bord boven de weg een noodremming veroorzaken. Grijs = stilstaand, oranje = bewegend.",q:"Rij een tiental seconden. Welke objecten zijn grijs? Zet daarna <b>Stilstaande doelen wegfilteren</b> aan (Sensor \u2192 Radar \u2192 Verwerking). Wat blijft er over? Wat gebeurt er met een auto die stilstaat in jouw rijstrook, bijvoorbeeld aan het einde van een file?",a:"Grijs: vangrail, middenberm, geluidsmuur, brug, borden, de pechauto en de verloren band. Met het filter blijven enkel de rijdende voertuigen over: de auto voor ons, de zwarte auto, de vrachtwagen en de tegenliggers. Een stilstaande auto in je rijstrook wordt \xF3\xF3k weggefilterd. Daarom waarschuwen handleidingen dat ACC niet altijd remt voor stilstaande voertuigen; lidar en camera moeten dat opvangen."},{t:"Spookdoelen via de vangrail",set:{world:"highway",drive:!0,layout:["world","radar"],lidar:{preset:"vlp16"},radar:{preset:"mrr",color:"source",multipath:!0}},u:"Radargolven kaatsen op een vlakke metalen of betonnen wand (vangrail, middenberm, muur), zoals licht op een spiegel. Een deel bereikt het doel via die omweg: de radar ziet dan een tweede doel, gespiegeld achter de wand. Paars = spookdoel, groenblauw = echt object.",q:"Waar verschijnen de spookdoelen van de vrachtwagen en de auto voor ons? Hebben ze dezelfde snelheid als het echte voertuig (Meting \u2192 Radar)? Zet <b>Weerkaatsing via vangrail en muren</b> uit en weer aan (Sensor \u2192 Radar \u2192 Verwerking). Wat zou een systeem denken van een spookdoel op de rijbaan van de tegenliggers?",a:"Rechts achter de vangrail, in de berm (ongeveer 14 \xE0 18 m rechts), en gespiegeld in de middenberm, dus op de rijbaan van de tegenliggers (ongeveer 11 \xE0 14 m links). Ze zijn zwakker, maar hebben bijna dezelfde radiale snelheid als het echte voertuig. Op de linkerrijbaan rijdt zo'n spookdoel dus in \xF3nze richting: een systeem zou kunnen denken aan een spookrijder. Doelen volgen over meerdere metingen en vergelijken met lidar of camera ontmaskert het spookdoel."},{t:"Regen tegenover een vuile radarkap",set:{world:"highway",layout:["world","radar"],lidar:{preset:"vlp16"},radar:{preset:"lrr"}},u:'Regen dempt 77 GHz-golven een beetje: zelfs een stortbui kost op 100 m ongeveer 1 dB. Een laag modder, sneeuw of ijs op de radarkap (het plastic kapje v\xF3\xF3r de radar) dempt veel meer, tot 15 dB. Omdat het signaal met <span class="f">R\u2074</span> afneemt, deelt 15 dB het bereik door <span class="f">10<sup>15/40</sup> \u2248 2,4</span>.',q:"Noteer het bereik voor een auto (<b>Meting</b> \u2192 Radar). Ze
